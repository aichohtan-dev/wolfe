name: Wolfe CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wolfe
          POSTGRES_USER: wolfe
          POSTGRES_PASSWORD: wolfe
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x backend/mvnw
      - run: backend/mvnw -q test
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/wolfe
          DATABASE_USERNAME: wolfe
          DATABASE_PASSWORD: wolfe
          REDIS_URL: redis://localhost:6379
          WOLFE_FRONTEND_ORIGIN: http://localhost:5173
