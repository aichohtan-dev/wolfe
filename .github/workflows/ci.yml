name: Wolfe CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run test:contract
      - run: npm run security:scan
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: wolfe
          POSTGRES_USER: wolfe
          POSTGRES_PASSWORD: wolfe
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x backend/mvnw
      - name: Generate ephemeral backend test secret
        shell: bash
        run: printf 'WOLFE_JWT_SECRET=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: backend/mvnw -q test
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/wolfe
          DATABASE_USERNAME: wolfe
          DATABASE_PASSWORD: wolfe
          REDIS_URL: redis://localhost:6379
          WOLFE_FRONTEND_ORIGIN: http://localhost:5173

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: git diff --check
      - name: Lightweight secret pattern scan
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nEI "(AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,})" -- . '!package-lock.json'; then
            echo "Potential credential material detected."
            exit 1
          fi
      - run: ./backend/mvnw -q -DskipTests dependency:analyze
