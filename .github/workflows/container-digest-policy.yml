name: Container image pin policy
on:
  workflow_dispatch:
  push:
    paths:
      - "Dockerfile*"
      - "docker-compose*.yml"
      - ".github/workflows/container-digest-policy.yml"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Reject mutable Docker image references
        shell: bash
        run: |
          set -euo pipefail
          bad=$(grep -RInE '(^|[[:space:]]|image:[[:space:]])(postgres|redis|node|nginx|eclipse-temurin):[^@[:space:]]+[[:space:]]*(#.*)?$' Dockerfile* docker-compose*.yml 2>/dev/null || true)
          if [[ -n "$bad" ]]; then
            echo "$bad"
            echo 'Mutable base/service image reference detected; pin to @sha256 digest.'
            exit 1
          fi
          if grep -RInE '^[[:space:]-]+uses:[[:space:]]+[^@]+@v[0-9]+' .github/workflows; then
            echo 'Mutable GitHub Action tag detected; pin actions to full commit SHAs.'
            exit 1
          fi
