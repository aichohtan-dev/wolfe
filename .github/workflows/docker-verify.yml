name: Docker Verification
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  docker-verify:
    runs-on: ubuntu-latest
    env:
      WOLFE_FRONTEND_ORIGIN: http://localhost
    steps:
      - uses: actions/checkout@v4

      - name: Generate ephemeral CI credentials
        shell: bash
        run: |
          set -euo pipefail
          printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          printf 'WOLFE_JWT_SECRET=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Verify no static CI credentials remain
        run: |
          if git grep -nE 'ci_test_|super-secret-jwt-signing-key' -- ':!.github/workflows/docker-verify.yml'; then
            echo "Static CI credential material found in workflow files."
            exit 1
          fi

      - name: Verify Docker CLI and Compose
        run: |
          docker --version
          docker compose version

      - name: Validate Docker Compose Configuration
        run: docker compose config --quiet

      - name: Build Docker Stack
        run: docker compose build --no-cache

      - name: Start Docker Stack
        run: docker compose up -d

      - name: Wait for PostgreSQL and API to be Healthy
        run: |
          echo "Waiting for services to become ready..."
          for i in {1..60}; do
            if docker compose exec -T api wget -qO- http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "API is UP!"
              break
            fi
            echo "Waiting for API... ($i/60)"
            sleep 2
            if [ "$i" -eq 60 ]; then
              echo "API did not become healthy within the timeout."
              docker compose ps
              exit 1
            fi
          done

      - name: Verify Endpoints and Reverse Proxy
        run: |
          echo "Checking docker compose ps:"
          docker compose ps

          echo "Checking frontend on port 80:"
          curl -f -s -o /dev/null -w "%{http_code}\n" http://localhost/

          echo "Checking /actuator/health:"
          docker compose exec -T api wget -qO- http://localhost:8080/actuator/health

          echo "Checking /actuator/health/liveness:"
          docker compose exec -T api wget -qO- http://localhost:8080/actuator/health/liveness

          echo "Checking /actuator/health/readiness:"
          docker compose exec -T api wget -qO- http://localhost:8080/actuator/health/readiness

          echo "Checking /api/v1/products reverse proxy via nginx:"
          curl -f -s http://localhost/api/v1/products

      - name: Collect Docker Logs on Failure
        if: failure()
        run: |
          docker compose logs

      - name: Cleanup Docker Stack
        if: always()
        run: docker compose down -v
