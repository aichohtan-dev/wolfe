name: Docker Verification
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  docker-verify:
    runs-on: ubuntu-latest
    env:
      WOLFE_FRONTEND_ORIGIN: https://localhost
      WOLFE_SERVER_NAME: localhost
      WOLFE_PUBLIC_BASE_URL: https://localhost
      POSTGRES_IMAGE: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
      REDIS_IMAGE: redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate ephemeral CI credentials
        shell: bash
        run: |
          set -euo pipefail
          printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          printf 'REDIS_PASSWORD=%s\n' "$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          printf 'WOLFE_JWT_SECRET=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          printf 'WOLFE_BACKUP_KEY=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Verify no static CI credentials remain
        run: |
          if git grep -nE 'ci_test_|super-secret-jwt-signing-key' -- ':!.github/workflows/docker-verify.yml'; then
            echo "Static CI credential material found in workflow files."
            exit 1
          fi

      - name: Verify Docker CLI and Compose
        run: |
          docker --version
          docker compose version

      - name: Validate Docker Compose Configuration
        run: docker compose config --quiet

      - name: Build Docker Stack
        run: docker compose build --no-cache

      - name: Generate ephemeral TLS certificate
        run: |
          mkdir -p ops/certs
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -keyout ops/certs/privkey.pem -out ops/certs/fullchain.pem -subj "/CN=localhost"

      - name: Start Docker Stack
        run: docker compose up -d

      - name: Wait for PostgreSQL and API to be Healthy
        run: |
          echo "Waiting for services to become ready..."
          for i in {1..60}; do
            if docker compose exec -T api wget -qO- http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "API is UP!"
              break
            fi
            echo "Waiting for API... ($i/60)"
            sleep 2
            if [ "$i" -eq 60 ]; then
              echo "API did not become healthy within the timeout."
              docker compose ps
              exit 1
            fi
          done

      - name: Database integrity preflight
        run: ./ops/preflight-v43-integrity.sh


      - name: Verify encrypted backup and isolated PostgreSQL restore
        run: |
          set -euo pipefail
          mkdir -p /tmp/wolfe-backups
          WOLFE_BACKUP_KEY="$WOLFE_BACKUP_KEY" ./ops/backup-all.sh /tmp/wolfe-backups
          WOLFE_BACKUP_KEY="$WOLFE_BACKUP_KEY" ./ops/verify-backup.sh /tmp/wolfe-backups/postgres/*.dump.enc /tmp/wolfe-backups/media/*.tar.gz.enc
          docker compose exec -T postgres createdb -U "${POSTGRES_USER:-wolfe}" wolfe_restore_test
          dump="$(ls /tmp/wolfe-backups/postgres/*.dump.enc | head -1)"
          openssl enc -d -aes-256-cbc -pbkdf2 -in "$dump" -out /tmp/wolfe-restore.dump -pass env:WOLFE_BACKUP_KEY
          docker compose cp /tmp/wolfe-restore.dump postgres:/tmp/wolfe-restore.dump
          docker compose exec -T postgres pg_restore -U "${POSTGRES_USER:-wolfe}" -d wolfe_restore_test --clean --if-exists /tmp/wolfe-restore.dump
          docker compose exec -T postgres dropdb -U "${POSTGRES_USER:-wolfe}" wolfe_restore_test
          mkdir -p /tmp/wolfe-media-restore
          for media in /tmp/wolfe-backups/media/*.tar.gz.enc; do tmp="$(mktemp)"; openssl enc -d -aes-256-cbc -pbkdf2 -in "$media" -out "$tmp" -pass env:WOLFE_BACKUP_KEY; tar -xzf "$tmp" -C /tmp/wolfe-media-restore; rm -f "$tmp"; done
          test -d /tmp/wolfe-media-restore/imports || test -d /tmp/wolfe-media-restore/published

      - name: Verify Endpoints and Reverse Proxy
        run: |
          echo "Checking docker compose ps:"
          docker compose ps

          echo "Checking frontend on port 80:"
          curl -k -f -s -o /dev/null -w "%{http_code}\n" https://localhost/

          echo "Checking /actuator/health:"
          docker compose exec -T api wget -qO- http://localhost:8080/actuator/health

          echo "Checking /actuator/health/liveness:"
          docker compose exec -T api wget -qO- http://localhost:8080/actuator/health/liveness

          echo "Checking /actuator/health/readiness:"
          docker compose exec -T api wget -qO- http://localhost:8080/actuator/health/readiness

          echo "Checking /api/v1/products reverse proxy via nginx:"
          curl -k -f -s https://localhost/api/v1/products

      - name: Collect Docker Logs on Failure
        if: failure()
        run: |
          docker compose logs

      - name: Cleanup Docker Stack
        if: always()
        run: docker compose down -v
