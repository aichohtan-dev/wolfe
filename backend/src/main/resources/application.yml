server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    max-swallow-size: 50MB
    connection-timeout: 10s
spring:
  application:
    name: wolfe-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/wolfe}
    username: ${DATABASE_USERNAME:wolfe}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:3000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
      data-source-properties:
        options: "-c statement_timeout=${DB_STATEMENT_TIMEOUT_MS:30000}"
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mvc:
    async:
      request-timeout: ${WOLFE_ASYNC_REQUEST_TIMEOUT_MS:30000}
  flyway:
    enabled: true
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:25}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${WOLFE_TRACING_SAMPLE_RATE:0.1}
  otlp:
    tracing:
      endpoint: ${WOLFE_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
WOLFE_JWT_SECRET: ${WOLFE_JWT_SECRET:}
WOLFE_JWT_TTL_SECONDS: 900
WOLFE_FRONTEND_ORIGIN: "http://localhost:5173"
WOLFE_PUBLIC_BASE_URL: ${WOLFE_PUBLIC_BASE_URL:http://localhost}
springdoc:
  api-docs:
    enabled: ${WOLFE_OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${WOLFE_OPENAPI_ENABLED:false}
    path: /swagger-ui.html

WOLFE_MAX_SESSIONS: ${WOLFE_MAX_SESSIONS:5}

WOLFE_CONFIGURATION_TTL_DAYS: ${WOLFE_CONFIGURATION_TTL_DAYS:30}
