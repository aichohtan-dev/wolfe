server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
spring:
  application:
    name: wolfe-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/wolfe}
    username: ${DATABASE_USERNAME:wolfe}
    password: ${DATABASE_PASSWORD:wolfe}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
WOLFE_JWT_SECRET: "wolfe-development-jwt-secret-key-at-least-32-chars-2026"
WOLFE_JWT_TTL_SECONDS: 900
WOLFE_FRONTEND_ORIGIN: "http://localhost:5173"
springdoc:
  api-docs:
    enabled: ${WOLFE_OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${WOLFE_OPENAPI_ENABLED:false}
    path: /swagger-ui.html
